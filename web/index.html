<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Pipeline Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
  :root{
    --ground:#F3F5F4; --surface:#FFFFFF; --surface-2:#EDF1EF; --surface-3:#E4EAE7;
    --ink:#14201B; --ink-soft:#56635E; --ink-faint:#86918C;
    --rule:#DAE0DC; --rule-strong:#BFC9C4;
    --accent:#0E5F5A; --accent-ink:#FFFFFF; --accent-soft:#DFEDEA;
    --crit:#A0342A; --crit-soft:#F7E6E3;
    --warn:#855C0C; --warn-soft:#F6EDD8;
    --ctx:#2F5A85; --ctx-soft:#E4ECF5;
    --ok:#2D6A45; --ok-soft:#E2EFE6;
    --hl:#FFF1B8;
    --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0F1513; --surface:#161F1D; --surface-2:#1C2725; --surface-3:#23302D;
      --ink:#E6ECE9; --ink-soft:#A0ADA8; --ink-faint:#75817C;
      --rule:#293431; --rule-strong:#3A4744;
      --accent:#56B8AC; --accent-ink:#0B1412; --accent-soft:#16312E;
      --crit:#E78A7A; --crit-soft:#34201C;
      --warn:#D9A742; --warn-soft:#30281A;
      --ctx:#8DB4DE; --ctx-soft:#1B2735;
      --ok:#7CC697; --ok-soft:#172C20;
      --hl:#4A4118;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F1513; --surface:#161F1D; --surface-2:#1C2725; --surface-3:#23302D;
    --ink:#E6ECE9; --ink-soft:#A0ADA8; --ink-faint:#75817C;
    --rule:#293431; --rule-strong:#3A4744;
    --accent:#56B8AC; --accent-ink:#0B1412; --accent-soft:#16312E;
    --crit:#E78A7A; --crit-soft:#34201C;
    --warn:#D9A742; --warn-soft:#30281A;
    --ctx:#8DB4DE; --ctx-soft:#1B2735;
    --ok:#7CC697; --ok-soft:#172C20;
    --hl:#4A4118;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
  button,input{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .mono{font-family:var(--mono); font-variant-ligatures:none}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  .bar{background:var(--surface); border-bottom:1px solid var(--rule); padding-inline:20px}
  .bar-in{max-width:1320px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; padding-block:12px}
  .brand{font-family:var(--serif); font-weight:600; font-size:18px; letter-spacing:-.01em; margin:0}
  .brand small{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase; margin-left:8px}
  .quarters{display:flex; flex-wrap:wrap; gap:4px 26px; margin:0 0 0 auto; font-size:12.5px}
  .quarters div{display:flex; gap:8px; align-items:baseline}
  .quarters dt{font-family:var(--mono); font-weight:600; font-size:12px; color:var(--ink)}
  .quarters dd{margin:0; color:var(--ink-soft)}

  .banner{background:var(--warn-soft); color:var(--ink); border-bottom:1px solid var(--rule); padding-inline:20px}
  .banner p{max-width:1320px; margin:0 auto; padding-block:9px; font-size:13.5px}
  .banner b{color:var(--warn)}

  /* ---------- layout ---------- */
  .wrap{max-width:1320px; margin:0 auto; padding-inline:20px; padding-block:22px 64px; display:grid; grid-template-columns:320px minmax(0,1fr); gap:24px; align-items:start}
  @media(max-width:920px){ .wrap{grid-template-columns:1fr} }

  /* ---------- sidebar ---------- */
  .side{position:sticky; top:16px; display:flex; flex-direction:column; gap:18px}
  @media(max-width:920px){ .side{position:static} }
  .ask{background:var(--surface); border:1px solid var(--rule); padding:14px}
  .ask label{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px}
  .ask-row{display:flex; gap:8px}
  .ask input{flex:1; min-width:0; background:var(--ground); border:1px solid var(--rule-strong); padding:9px 10px; font-size:14.5px}
  .ask input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accent-soft)}
  .btn{background:var(--accent); color:var(--accent-ink); border:0; padding:9px 14px; font-weight:600; cursor:pointer; white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55; cursor:progress}
  .hint{font-size:12px; color:var(--ink-faint); margin:8px 0 0}
  .hint kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--rule-strong); padding:0 4px; background:var(--surface-2)}

  .group h3{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 6px}
  .qlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; background:var(--rule); border:1px solid var(--rule)}
  .qlist button{width:100%; text-align:left; background:var(--surface); border:0; padding:8px 11px; font-size:13.5px; line-height:1.4; cursor:pointer}
  .qlist button:hover{background:var(--surface-2)}
  .qlist button[aria-current="true"]{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
  .audit-link{width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule); padding:10px 11px; cursor:pointer; font-size:13.5px}
  .audit-link b{display:block; font-weight:600}
  .audit-link span{color:var(--ink-soft); font-size:12.5px}
  .audit-link[aria-current="true"]{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}

  /* ---------- main ---------- */
  main{min-width:0}
  .asked{font-family:var(--serif); font-size:15px; color:var(--ink-soft); margin:0 0 10px; font-style:italic}
  .card{background:var(--surface); border:1px solid var(--rule)}
  .sec{border-top:1px solid var(--rule)}
  .sec:first-child{border-top:0}
  .sec > summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px; padding:13px 20px; user-select:none}
  .sec > summary::-webkit-details-marker{display:none}
  .sec > summary::before{content:"+"; font-family:var(--mono); color:var(--ink-faint); width:10px}
  .sec[open] > summary::before{content:"−"}
  .sec > summary:hover{background:var(--surface-2)}
  .sec-title{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
  .sec-note{font-size:12.5px; color:var(--ink-faint)}
  .sec-body{padding:2px 20px 20px 42px}
  @media(max-width:600px){ .sec-body{padding-left:20px} }
  .toolbar{display:flex; justify-content:flex-end; gap:8px; margin:0 0 8px}
  .ghost{background:transparent; border:1px solid var(--rule-strong); padding:5px 10px; font-size:12.5px; cursor:pointer; color:var(--ink-soft)}
  .ghost:hover{color:var(--ink); border-color:var(--ink-faint)}

  /* answer */
  .answer{padding:20px 22px 18px}
  .read-as{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; display:flex; gap:10px; flex-wrap:wrap}
  .read-as span{color:var(--accent); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:11px; padding-top:1px}
  .headline{font-family:var(--serif); font-weight:500; font-size:clamp(20px,2.3vw,25px); line-height:1.35; letter-spacing:-.01em; margin:0 0 10px; text-wrap:pretty; max-width:62ch}
  .lines{margin:0; padding:0; list-style:none; max-width:70ch}
  .lines li{margin:4px 0; color:var(--ink)}
  .lines li.sub{padding-left:18px; position:relative; color:var(--ink-soft)}
  .lines li.sub::before{content:""; position:absolute; left:4px; top:.72em; width:6px; height:1px; background:var(--ink-faint)}
  .lines li.why{font-weight:600; margin-top:10px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .chip{font-family:var(--mono); font-size:11.5px; font-weight:600; padding:4px 9px; border:0; cursor:pointer; letter-spacing:.02em}
  .chip.critical{background:var(--crit-soft); color:var(--crit)}
  .chip.warning{background:var(--warn-soft); color:var(--warn)}
  .chip.context{background:var(--ctx-soft); color:var(--ctx)}
  .chip.none{background:var(--ok-soft); color:var(--ok); cursor:default}

  /* metrics */
  .kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); border-top:1px solid var(--rule); border-left:1px solid var(--rule); margin:0 0 14px}
  .kv div{background:var(--surface); padding:10px 12px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule)}
  .kv dt{font-size:12px; color:var(--ink-soft); margin:0}
  .kv dd{margin:2px 0 0; font-family:var(--mono); font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; word-break:break-word}
  .kv small{display:block; font-family:var(--sans); font-size:11.5px; color:var(--ink-faint); font-weight:400}
  .tbl-title{font-size:13px; font-weight:600; margin:14px 0 6px}
  .tscroll{overflow-x:auto; border:1px solid var(--rule); background:var(--surface)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--rule); white-space:nowrap}
  th{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); position:sticky; top:0}
  td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
  td.line{color:var(--ink-faint); font-family:var(--mono)}
  tbody tr:last-child td{border-bottom:0}
  tr.hl td{background:var(--hl)}
  .tag{font-family:var(--mono); font-size:10.5px; padding:1px 6px; margin-right:4px; white-space:nowrap}
  .tag.bad{background:var(--crit-soft); color:var(--crit)}
  .tag.mid{background:var(--warn-soft); color:var(--warn)}
  .tag.good{background:var(--ok-soft); color:var(--ok)}
  .tag.info{background:var(--ctx-soft); color:var(--ctx)}
  .missing{color:var(--crit); font-weight:600}

  /* source */
  .ds{border:1px solid var(--rule); margin:0 0 14px; scroll-margin-top:16px}
  .ds.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
  .ds-head{display:flex; align-items:baseline; gap:10px; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--rule)}
  .key{font-family:var(--mono); font-weight:600; font-size:12px; background:var(--accent); color:var(--accent-ink); padding:1px 6px}
  .ds-head b{font-weight:600; font-size:13.5px}
  .ds dl{display:grid; grid-template-columns:92px minmax(0,1fr); gap:5px 12px; margin:0; padding:10px 12px; font-size:13px}
  .ds dt{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding-top:2px}
  .ds dd{margin:0; min-width:0}
  .filters{margin:0; padding:0; list-style:none; font-family:var(--mono); font-size:12.5px}
  .filters li{padding:1px 0}
  .ds .tscroll{border-width:1px 0 0; max-height:360px}

  /* method */
  .qjson{font-family:var(--mono); font-size:12px; background:var(--surface-2); border:1px solid var(--rule); padding:10px 12px; margin:6px 0 14px; overflow-x:auto; white-space:pre; line-height:1.5}
  .steps{margin:0 0 6px; padding-left:18px; font-size:13.5px; color:var(--ink-soft)}
  .calc{border-left:3px solid var(--accent); padding:4px 0 4px 14px; margin:16px 0}
  .calc h4{margin:0 0 4px; font-size:13.5px; font-weight:600}
  .calc .formula{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft)}
  .calc .step{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums}
  .calc .step.result{font-size:17px; font-weight:600}
  .calc .undef{color:var(--crit)}
  .terms{margin:6px 0 0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 10px; font-size:12.5px}
  .terms dt{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; padding-top:1px}
  .terms dd{margin:0; color:var(--ink-soft)}

  /* assumptions and flags */
  .assume{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; max-width:78ch}
  .assume li{padding-left:16px; position:relative}
  .assume li::before{content:""; position:absolute; left:0; top:.62em; width:6px; height:6px; background:var(--accent)}
  .flags{display:flex; flex-direction:column; gap:10px}
  .flag{border-left:4px solid var(--rule-strong); background:var(--surface-2); padding:10px 14px}
  .flag.critical{border-color:var(--crit)} .flag.warning{border-color:var(--warn)} .flag.context{border-color:var(--ctx)}
  .flag-top{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; margin-bottom:3px}
  .lvl{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px}
  .lvl.critical{background:var(--crit-soft); color:var(--crit)} .lvl.warning{background:var(--warn-soft); color:var(--warn)} .lvl.context{background:var(--ctx-soft); color:var(--ctx)}
  .code{font-family:var(--mono); font-size:12px; font-weight:600}
  .flag p{margin:0; font-size:13.5px; max-width:80ch}

  /* naive contrast */
  .naive{border-top:1px dashed var(--rule-strong); padding:12px 20px 16px}
  .naive-toggle{background:transparent; border:0; padding:0; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
  .naive-toggle:hover{color:var(--ink)}
  .naive-body{margin-top:14px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px 22px}
  @media(max-width:760px){ .naive-body{grid-template-columns:1fr} }
  .naive-body[hidden]{display:none}
  .naive-say{grid-column:1/-1; background:var(--surface-2); border:1px solid var(--rule); padding:12px 16px}
  .naive-say .who{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
  .naive-say q{display:block; font-family:var(--serif); font-size:18px; line-height:1.45; margin-top:4px; quotes:"\201C" "\201D"}
  .naive-differs{grid-column:1/-1; margin:0; border-left:4px solid var(--crit); background:var(--crit-soft); padding:8px 12px; font-size:14px}
  .naive h4{margin:0 0 6px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
  .naive ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-soft)}
  .naive li{margin:3px 0}

  /* inline references */
  .ref,.deal{font-family:var(--mono); font-size:.92em; border:0; padding:0 3px; cursor:pointer; background:var(--accent-soft); color:var(--accent)}
  .ref:hover,.deal:hover{background:var(--accent); color:var(--accent-ink)}
  .nw{white-space:nowrap}

  /* rejection, errors, loading */
  .reject{padding:20px 22px}
  .reject h2{font-family:var(--serif); font-weight:500; font-size:23px; margin:0 0 4px}
  .reject .sub{color:var(--ink-soft); margin:0 0 16px}
  .problem{border-left:4px solid var(--crit); background:var(--crit-soft); padding:10px 14px; margin-bottom:10px}
  .problem .code{color:var(--crit)}
  .problem p{margin:3px 0 0; font-size:14px}
  .understood{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin:14px 0 6px}
  .caps{font-size:13.5px; color:var(--ink-soft); margin:0}
  .loading{padding:28px 22px; color:var(--ink-soft)}
  .bar-pulse{height:3px; background:linear-gradient(90deg,transparent,var(--accent),transparent); background-size:50% 100%; background-repeat:no-repeat; animation:pulse 1.1s linear infinite}
  @keyframes pulse{0%{background-position:-50% 0}100%{background-position:150% 0}}

  /* audit */
  .audit{padding:22px}
  .eyebrow{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--crit); margin:0 0 8px}
  .audit h2{font-family:var(--serif); font-weight:600; font-size:clamp(22px,2.6vw,28px); line-height:1.25; letter-spacing:-.012em; margin:0 0 6px; max-width:30ch}
  .audit .lede{color:var(--ink-soft); max-width:66ch; margin:0 0 18px}
  .versus{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); margin-bottom:22px}
  @media(max-width:600px){ .versus{grid-template-columns:1fr} }
  .versus div{background:var(--surface); padding:14px 16px}
  .versus .lbl{font-size:12.5px; color:var(--ink-soft)}
  .versus .big{font-family:var(--serif); font-size:clamp(26px,3.2vw,34px); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15}
  .versus .meta{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint)}
  .eyebrow.plain{color:var(--ink-faint); margin:26px 0 10px}
  :root{--bar-open:#28503A; --bar-down:#C4584A; --bar-close:#2B3430}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bar-open:#7CC497; --bar-down:#B5473A; --bar-close:#C9D2CE} }
  :root[data-theme="dark"]{--bar-open:#7CC497; --bar-down:#B5473A; --bar-close:#C9D2CE}
  .chart{border:1px solid var(--rule); background:var(--surface); padding:14px 10px 6px; position:relative}
  .chart svg{display:block; width:100%; height:auto; overflow:visible}
  .chart .grid{stroke:var(--rule); stroke-width:1}
  .chart .base{stroke:var(--rule-strong); stroke-width:1}
  .chart .conn{stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3}
  .chart .val{font-family:var(--mono); font-size:16px; font-weight:600; fill:var(--ink); text-anchor:middle; font-variant-numeric:tabular-nums}
  .chart .axis{font-family:var(--mono); font-size:15px; fill:var(--ink-soft); text-anchor:middle}
  .chart .tick{font-family:var(--mono); font-size:14px; fill:var(--ink-faint); text-anchor:end}
  .chart .bar{cursor:pointer}
  .chart .bar rect.mark{transition:opacity .15s}
  .chart .bar rect.hit{fill:transparent}
  .chart .bar:hover rect.mark,.chart .bar:focus rect.mark{opacity:.82}
  .chart .bar:focus{outline:none}
  .chart .bar:focus-visible rect.hit{stroke:var(--accent); stroke-width:2}
  .tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--surface); font-size:12.5px; padding:6px 9px; max-width:260px; line-height:1.4; transform:translate(-50%,-100%); white-space:normal}
  .tip[hidden]{display:none}
  .chart-note{font-size:12px; color:var(--ink-faint); margin:8px 4px 2px}
  .brows{display:flex; flex-direction:column; gap:10px}
  .brow{border:1px solid var(--rule); background:var(--surface); scroll-margin-top:16px}
  .brow.flash{animation:flash 1.4s ease-out}
  .brow-head{width:100%; display:flex; align-items:center; gap:16px; background:transparent; border:0; padding:14px 18px; cursor:pointer; text-align:left}
  .brow-head:hover{background:var(--surface-2)}
  .brow-head .t{flex:1; min-width:0}
  .brow-head b{display:block; font-size:16px; font-weight:600}
  .brow-head small{font-family:var(--mono); font-size:12px; color:var(--ink-faint)}
  .brow-head .amt{font-family:var(--mono); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
  .brow-head .amt.decrease{color:var(--crit)} .brow-head .amt.total-open{color:var(--ok)} .brow-head .amt.total-close{color:var(--ink)}
  .brow-head .chev{font-family:var(--mono); color:var(--ink-faint); width:12px}
  .brow-body{border-top:1px solid var(--rule); padding:12px 18px 16px; background:var(--surface-2)}
  .cmp th.grp{text-align:left; border-bottom:2px solid var(--ink); background:transparent; color:var(--ink-soft)}
  .cmp th{background:transparent}
  .cmp td.arrow{color:var(--ink-faint); text-align:center; padding-inline:4px}
  .cmp td.chg{background:var(--warn-soft); color:var(--warn); font-weight:600}
  .cmp td.id{font-family:var(--mono)}
  .cmp td{font-family:var(--mono); font-size:12.5px}
  .beyond{display:flex; flex-direction:column; gap:12px}
  .bcard{border:1px solid var(--rule); background:var(--surface); padding:16px 18px}
  .bcard-top{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:6px}
  .bcard h3{margin:0; font-size:16px; font-weight:600}
  .sev{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px}
  .sev.high{background:var(--crit-soft); color:var(--crit)} .sev.ambiguity{background:var(--warn-soft); color:var(--warn)} .sev.minor{background:var(--surface-3); color:var(--ink-soft)}
  .bcard p{margin:0 0 10px; max-width:84ch}
  .toggle{background:transparent; border:0; padding:0; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
  .toggle:hover{color:var(--ink)}
  .bcard .tscroll{margin-top:10px}
  .next{margin-top:18px; font-size:14px; color:var(--ink-soft)}

  /* rep coverage chart */
  :root{--won:#3E6CB8; --below:#E07B66; --meets:#1F6B40}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--won:#5F86CF; --below:#B04A3C; --meets:#4FA571} }
  :root[data-theme="dark"]{--won:#5F86CF; --below:#B04A3C; --meets:#4FA571}
  .repchart{position:relative; padding-top:4px}
  .rc-controls{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 24px; border:1px solid var(--rule); background:var(--surface-2); padding:14px 16px}
  .rc-slider{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px}
  .rc-slider label{font-family:var(--mono); font-size:13px; white-space:nowrap}
  .rc-slider output{font-weight:600}
  .rc-range{display:flex; flex-direction:column; gap:2px; width:min(240px,100%)}
  .rc-range input{width:100%; accent-color:var(--ink); margin:0}
  .rc-range .ends{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
  .seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--rule-strong); background:var(--surface)}
  .seg button{background:transparent; border:0; padding:6px 12px; font-size:12.5px; color:var(--ink-soft); cursor:pointer}
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
  .rc-head{font-family:var(--serif); font-weight:500; font-size:clamp(19px,2vw,23px); margin:18px 0 2px; text-wrap:balance}
  .rc-head b{font-weight:600}
  .rc-note{font-size:12.5px; color:var(--ink-faint); margin:0 0 10px; max-width:80ch}
  .rc-legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink-soft); margin:0 0 8px}
  .rc-legend span{display:inline-flex; align-items:center; gap:6px}
  .rc-legend i{display:inline-block; width:14px; height:8px; border-radius:2px}
  .rc-legend i.tick{width:2px; height:14px; border-radius:0; background:var(--ink)}
  .rc td{font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums}
  .rc th,.rc td{padding-inline:7px}
  .rc .tag{margin-right:6px}
  .rc small.cnt{display:block; font-size:10.5px; color:var(--ink-faint); line-height:1.2}
  .rc td.name{font-family:var(--sans); font-size:13.5px}
  .rbar{position:relative; width:110px; height:10px; background:var(--surface-3); border-radius:2px; cursor:default}
  .rbar .w,.rbar .o{position:absolute; top:0; height:10px}
  .rbar .w{left:0; background:var(--won); border-radius:2px 0 0 2px}
  .rbar .o{border-radius:0 2px 2px 0}
  .rbar .o.below{background:var(--below)} .rbar .o.meets{background:var(--meets)} .rbar .o.unknown{background:var(--ink-faint)}
  .rbar .t{position:absolute; top:-4px; width:2px; height:18px; background:var(--ink); margin-left:-1px}
  td.barcell{padding-block:10px}

  @media(prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>
<script>/*RECORDED*/</script>

<header class="bar">
  <div class="bar-in">
    <p class="brand">Meridian Pipeline Intelligence <small>Evidence-first answers</small></p>
    <dl class="quarters" id="quarters"></dl>
  </div>
</header>
<div class="banner" id="banner" hidden><p></p></div>

<div class="wrap">
  <aside class="side">
    <form class="ask" id="ask-form" autocomplete="off">
      <label for="q">Ask about the pipeline</label>
      <div class="ask-row">
        <input id="q" name="q" type="text" maxlength="500" placeholder="e.g. Why is Priya at risk?">
        <button class="btn" id="ask-btn" type="submit">Ask</button>
      </div>
      <p class="hint">Each question is answered on its own. Press <kbd>/</kbd> to focus.</p>
    </form>
    <button class="audit-link" id="audit-link" type="button">
      <b id="bridge-title">The $1.99 M Bridge</b>
      <span>Why Q1 has two different totals</span>
    </button>
    <div id="suggestions"></div>
  </aside>

  <main id="main" aria-live="polite"></main>
</div>

<script>
(function () {
  "use strict";
  var RECORDED = window.MERIDIAN_RECORDED || null;
  var main = document.getElementById("main");
  var input = document.getElementById("q");
  var askBtn = document.getElementById("ask-btn");
  var current = null;

  // ------------------------------------------------------------------ helpers
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  // Turn [A] dataset references and deal IDs into links to the source rows.
  function linkify(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/Run `python ask\.py audit` for the reconciliation\./g,
               '<button type="button" class="ref" data-audit="1">Open the bridge</button> for the reconciliation.')
      .replace(/\b(\d{4}-\d{2}-\d{2})\b/g, '<span class="nw">$1</span>')
      .replace(/\[([A-Z])\]/g, '<button type="button" class="ref" data-ref="$1">[$1]</button>')
      .replace(/\b(OPP-\d{3})\b/g, '<button type="button" class="deal" data-deal="$1">$1</button>');
  }
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  // ------------------------------------------------------------------ data access
  function api(path, body) {
    if (RECORDED) {
      if (path === "/api/meta") return Promise.resolve(RECORDED.meta);
      if (path === "/api/audit") return Promise.resolve(RECORDED.audit);
      var hit = RECORDED.answers[body.question];
      return Promise.resolve(hit || {kind: "not_recorded", question: body.question});
    }
    var opts = body ? {method: "POST", headers: {"Content-Type": "application/json"},
                       body: JSON.stringify(body)} : {};
    return fetch(path, opts).then(function (r) { return r.json(); });
  }

  // ------------------------------------------------------------------ sidebar
  function renderMeta(meta) {
    var live = meta.mode === "live";
    document.getElementById("quarters").innerHTML = (meta.quarters || []).map(function (q) {
      return "<div><dt>" + esc(q.label) + "</dt><dd>" + esc(q.detail) + "</dd></div>";
    }).join("");
    if (!live) {
      var b = document.getElementById("banner");
      b.hidden = false;
      b.querySelector("p").innerHTML = "<b>Recorded run.</b> These answers were computed by the engine on " +
        esc(meta.recorded_on) + " and saved into this file. Only the listed questions are available; run <span class=\"mono\">python3 app.py</span> to ask anything else.";
    }
    var box = document.getElementById("suggestions");
    box.innerHTML = "";
    meta.suggestions.forEach(function (g) {
      var group = el('<div class="group"><h3>' + esc(g.group) + '</h3><ul class="qlist"></ul></div>');
      var list = group.querySelector("ul");
      g.questions.forEach(function (q) {
        var li = el("<li><button type=\"button\"></button></li>");
        li.firstChild.textContent = q;
        li.firstChild.addEventListener("click", function () { input.value = q; ask(q); });
        list.appendChild(li);
      });
      box.appendChild(group);
    });
    box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "18px";
  }
  function markCurrent(label) {
    document.querySelectorAll(".qlist button").forEach(function (b) {
      b.setAttribute("aria-current", b.textContent === label ? "true" : "false");
    });
    document.getElementById("audit-link").setAttribute("aria-current", label === "__audit__" ? "true" : "false");
  }

  // ------------------------------------------------------------------ actions
  function loading(text) {
    main.innerHTML = '<div class="card"><div class="bar-pulse"></div><div class="loading">' + esc(text) + "</div></div>";
  }
  function ask(question) {
    question = (question || "").trim();
    if (!question) { input.focus(); return; }
    current = question;
    markCurrent(question);
    askBtn.disabled = true;
    loading("Validating the question, then computing from the source rows…");
    api("/api/ask", {question: question}).then(function (p) {
      if (current !== question) return;
      render(p, question);
    }).catch(function () {
      main.innerHTML = '<div class="card reject"><h2>Can’t reach the engine</h2><p class="sub">The page couldn’t connect to the local server. Check that <span class="mono">python3 app.py</span> is still running, then ask again.</p></div>';
    }).then(function () { askBtn.disabled = false; });
  }
  function showAudit() {
    current = "__audit__";
    markCurrent("__audit__");
    loading("Reconciling both extracts…");
    api("/api/audit").then(function (p) { if (current === "__audit__") render(p); })
      .catch(function () { main.innerHTML = '<div class="card reject"><h2>Can’t reach the engine</h2><p class="sub">Check that <span class="mono">python3 app.py</span> is still running.</p></div>'; });
  }

  function render(p, question) {
    main.innerHTML = "";
    if (p.kind === "answer") renderAnswer(p);
    else if (p.kind === "rejection") renderRejection(p);
    else if (p.kind === "audit") renderAudit(p);
    else if (p.kind === "not_recorded") {
      main.appendChild(el('<div class="card reject"><h2>Not in this recording</h2><p class="sub">This file only holds the questions listed on the left. To ask “' + esc(p.question) + '”, run <span class="mono">python3 app.py</span> for the live engine.</p></div>'));
    } else {
      main.appendChild(el('<div class="card reject"><h2>' + (p.kind === "data_error" ? "Data error" : "Something went wrong") + '</h2><p class="sub">' + esc(p.message) + "</p></div>"));
    }
    main.scrollIntoView ? window.scrollTo({top: 0, behavior: "smooth"}) : null;
  }

  // ------------------------------------------------------------------ answer
  function tableHTML(t, ids) {
    var numeric = {};
    (t.numeric || []).forEach(function (c) { numeric[c] = true; });
    var dealCol = t.columns.indexOf("Deal");
    var head = t.columns.map(function (c) { return '<th class="' + (numeric[c] ? "n" : "") + '">' + esc(c) + "</th>"; }).join("");
    var body = t.rows.map(function (r, i) {
      var id = ids ? ids[i] : (dealCol >= 0 ? r[dealCol] : "");
      var cells = r.map(function (v, j) {
        var c = t.columns[j];
        var cls = numeric[c] ? "n" : "";
        if (c === "Line") cls += " line";
        var html;
        if (c === "Verdict") {
          var kind = v === "at risk" ? "bad" : v === "not at risk" ? "good" : "mid";
          html = '<span class="tag ' + kind + '">' + esc(v) + "</span>";
        } else if (c === "Notes") {
          html = String(v).split(", ").filter(Boolean).map(function (n) {
            return '<span class="tag ' + (n === "moved from Q1" ? "bad" : n === "recycled ID" ? "mid" : "info") + '">' + esc(n) + "</span>";
          }).join("");
        } else if (v === "MISSING") {
          html = '<span class="missing">MISSING</span>';
        } else {
          html = esc(v);
        }
        return '<td class="' + cls.trim() + '">' + html + "</td>";
      }).join("");
      return '<tr data-id="' + esc(id) + '">' + cells + "</tr>";
    }).join("");
    return '<div class="tscroll"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function section(id, title, note, open, bodyHTML) {
    return '<details class="sec" id="' + id + '"' + (open ? " open" : "") + '><summary><span class="sec-title">' +
      esc(title) + '</span><span class="sec-note">' + esc(note || "") + '</span></summary><div class="sec-body">' + bodyHTML + "</div></details>";
  }

  function naiveHTML(n) {
    if (!n) return "";
    return '<div class="naive"><button type="button" class="naive-toggle" data-naive="1" aria-expanded="false">Show what a naive tool would say</button>' +
      '<div class="naive-body" hidden>' +
      '<div class="naive-say"><span class="who">A naive tool, reading the same file</span><q>' + esc(n.text) + "</q></div>" +
      (n.differs ? '<p class="naive-differs">' + esc(n.differs) + "</p>" : "") +
      "<div><h4>What it leaves out</h4><ul>" + n.misses.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>" +
      "<div><h4>How the naive answer was computed</h4><ul>" + n.rules.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></div>" +
      "</div></div>";
  }

  function renderAnswer(p) {
    var fc = p.flag_counts;
    var chips = ["critical", "warning", "context"].filter(function (l) { return fc[l]; }).map(function (l) {
      return '<button type="button" class="chip ' + l + '" data-jump="sec-flags">' + fc[l] + " " + l + (fc[l] === 1 || l === "context" ? "" : "s") + "</button>";
    }).join("");
    if (!chips) chips = '<span class="chip none">No flags raised</span>';

    var lines = (p.lines || []).map(function (l) {
      if (l === "Why:") return '<li class="why">Why</li>';
      if (l.indexOf("- ") === 0) return '<li class="sub">' + linkify(l.slice(2)) + "</li>";
      return "<li>" + linkify(l) + "</li>";
    }).join("");

    var answerHTML = '<section class="answer" id="sec-answer">' +
      '<p class="read-as"><span>Read as</span>' + esc(p.read_as) + "</p>" +
      '<h2 class="headline">' + linkify(p.headline) + "</h2>" +
      (lines ? '<ul class="lines">' + lines + "</ul>" : "") +
      '<div class="chips">' + chips + "</div></section>";

    var metrics = "";
    if (p.metrics.length) {
      metrics += '<dl class="kv">' + p.metrics.map(function (m) {
        return "<div><dt>" + linkify(m.label) + "</dt><dd>" + esc(m.value) + (m.note ? "<small>" + esc(m.note) + "</small>" : "") + "</dd></div>";
      }).join("") + "</dl>";
    }
    p.tables.forEach(function (t) {
      metrics += '<p class="tbl-title">' + linkify(t.title) + "</p>" + tableHTML(t);
    });

    var source = p.datasets.map(function (d) {
      var rowsNote = d.kind === "deals"
        ? plural(d.count, "row") + " of " + d.rows_in_file + " in the file"
        : plural(d.count, "rep") + " of " + d.rows_in_file + " in the file";
      var uncounted = d.uncounted.length
        ? d.uncounted.map(function (u) { return '<span class="missing">' + esc(u.id) + "</span> line " + u.line + ": " + esc(u.reason); }).join("<br>")
        : "none";
      return '<div class="ds" id="ds-' + d.key + '"><div class="ds-head"><span class="key">' + d.key + "</span><b>" + esc(d.title) + "</b></div>" +
        "<dl><dt>File</dt><dd class=\"mono\">" + esc(d.file) + "</dd>" +
        "<dt>Snapshot</dt><dd>" + esc(d.snapshot.label) + "</dd>" +
        '<dt>Filters</dt><dd><ul class="filters">' + (d.filters.length ? d.filters.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") : "<li>none (every row)</li>") + "</ul></dd>" +
        "<dt>Rows</dt><dd>" + rowsNote + "</dd>" +
        '<dt>Total</dt><dd class="mono">' + esc(d.total_expr) + "</dd>" +
        "<dt>" + (d.kind === "deals" ? "Uncounted" : "Missing") + "</dt><dd>" + uncounted + "</dd></dl>" +
        (d.rows.length ? tableHTML({columns: d.columns, rows: d.rows, numeric: d.numeric}, d.ids) : "") + "</div>";
    }).join("");

    var q = JSON.stringify(p.method.query, null, 2);
    var method = '<ol class="steps"><li>The question was turned into this query and validated against the rep roster and snapshot manifest, before any deal data was read.</li></ol>' +
      '<pre class="qjson">' + esc(q) + "</pre>" +
      '<ol class="steps" start="2"><li>Rows were selected from the files under Source data using exactly the filters listed there. Rows that failed a check on load were never counted.</li></ol>' +
      p.method.calculations.map(function (c) {
        return '<div class="calc"><h4>' + linkify(c.name) + '</h4><div class="formula">' + linkify(c.name + " = " + c.formula) + "</div>" +
          c.steps.map(function (s, i) {
            var last = i === c.steps.length - 1;
            return '<div class="step' + (last ? " result" : "") + (last && !c.defined ? " undef" : "") + '">' + esc(s) + "</div>";
          }).join("") +
          '<dl class="terms">' + c.terms.map(function (t) {
            return "<dt>" + esc(t.role) + "</dt><dd>" + linkify(t.label) + " = <span class=\"mono\">" + esc(t.value) + "</span>: " + linkify(t.explanation) + "</dd>";
          }).join("") + "</dl></div>";
      }).join("");

    var assumptions = '<ul class="assume">' + p.assumptions.map(function (a) { return "<li>" + linkify(a.text) + "</li>"; }).join("") + "</ul>";

    var flags = p.flags.length ? '<div class="flags">' + p.flags.map(function (f) {
      return '<div class="flag ' + f.level + '"><div class="flag-top"><span class="lvl ' + f.level + '">' + f.level + '</span><span class="code">' + esc(f.code) + "</span></div><p>" + linkify(f.message) + "</p></div>";
    }).join("") + "</div>" : '<p class="sec-note">No flags raised.</p>';

    var fcTotal = fc.critical + fc.warning + fc.context;
    var card = el('<div><p class="asked">“' + esc(p.question) + '”</p>' +
      '<div class="toolbar"><button type="button" class="ghost" data-expand="1">Show all the work</button><button type="button" class="ghost" data-expand="0">Collapse</button></div>' +
      '<article class="card">' + answerHTML +
      // Rep-risk answers: the coverage chart replaces the ranking table and opens by default.
      (p.rep_chart
        ? section("sec-metrics", "Supporting metrics", "coverage by rep, with a threshold you can move", true, repChartHTML(p.rep_chart))
        : section("sec-metrics", "Supporting metrics", "", false, metrics)) +
      section("sec-source", "Source data", plural(p.datasets.length, "dataset") + " · file, snapshot, filters and every row", false, source) +
      section("sec-method", "Method", plural(p.method.calculations.length, "calculation"), false, method) +
      section("sec-assumptions", "Assumptions", plural(p.assumptions.length, "definition"), false, assumptions) +
      section("sec-flags", "Trust Flags", fcTotal ? plural(fcTotal, "flag") : "none", true, flags) +
      naiveHTML(p.naive) +
      "</article></div>");
    main.appendChild(card);
    if (p.rep_chart) bindRepChart(card, p.rep_chart);
  }

  // ------------------------------------------------------------------ rejection
  function renderRejection(p) {
    var understood = Object.keys(p.understood || {}).length
      ? '<p class="understood">Understood so far: ' + esc(JSON.stringify(p.understood)) + "</p>" : "";
    main.appendChild(el('<div><p class="asked">“' + esc(p.question) + '”</p><div class="card reject">' +
      "<h2>No answer</h2><p class=\"sub\">This question isn’t answered as asked, and nothing was computed.</p>" +
      p.problems.map(function (x) {
        return '<div class="problem"><span class="code">' + esc(x.code) + "</span><p>" + esc(x.message) + "</p></div>";
      }).join("") + understood + '<p class="caps">' + esc(p.capabilities) + "</p></div></div>"));
  }

  // ------------------------------------------------------------------ audit
  function compareTable(deals, fields) {
    fields = fields || ["account", "stage", "close", "value"];
    var names = {account: "Account", stage: "Stage", close: "Close date", value: "Value", loss: "Loss reason"};
    var hasBefore = deals.some(function (d) { return d.before; });
    var hasAfter = deals.some(function (d) { return d.after; });
    function val(d, side, f) {
      if (f === "loss") return d[side === "before" ? "loss_before" : "loss_after"];
      return d[side] ? d[side][f] : "";
    }
    function changed(d, f) {
      if (f === "loss") return d.loss_before !== d.loss_after;
      return d.changed.indexOf(f) >= 0;
    }
    var head1 = '<tr><th rowspan="2">Deal</th>' +
      (hasBefore ? '<th class="grp" colspan="' + fields.length + '">Q1 extract (what it was)</th>' : "") +
      (hasBefore && hasAfter ? '<th rowspan="2"></th>' : "") +
      (hasAfter ? '<th class="grp" colspan="' + fields.length + '">Q2 extract (what it is now)</th>' : "") + "</tr>";
    var sub = fields.map(function (f) { return "<th>" + names[f] + "</th>"; }).join("");
    var head2 = "<tr>" + (hasBefore ? sub : "") + (hasAfter ? sub : "") + "</tr>";
    var body = deals.map(function (d) {
      var cells = '<td class="id">' + esc(d.id) + "</td>";
      if (hasBefore) cells += fields.map(function (f) { return '<td class="' + (hasAfter && changed(d, f) ? "chg" : "") + '"><span class="nw">' + esc(val(d, "before", f)) + "</span></td>"; }).join("");
      if (hasBefore && hasAfter) cells += '<td class="arrow">→</td>';
      if (hasAfter) cells += fields.map(function (f) { return '<td class="' + (hasBefore && changed(d, f) ? "chg" : "") + '"><span class="nw">' + esc(val(d, "after", f)) + "</span></td>"; }).join("");
      return '<tr data-id="' + esc(d.id) + '">' + cells + "</tr>";
    }).join("");
    return '<div class="tscroll"><table class="cmp"><thead>' + head1 + head2 + "</thead><tbody>" + body + "</tbody></table></div>";
  }

  function waterfall(bars) {
    var W = 1000, H = 420, padL = 70, padR = 12, top = 36, bottom = 60;
    var plotH = H - top - bottom, plotW = W - padL - padR;
    var max = Math.max.apply(null, bars.map(function (b) { return Math.max(b.start, b.end); }));
    var step = Math.pow(10, Math.floor(Math.log10(max / 4)));
    var tickStep = [1, 2, 2.5, 5, 10].map(function (m) { return m * step; }).filter(function (v) { return max / v <= 6; })[0];
    var ymax = Math.ceil(max / tickStep) * tickStep;
    var y = function (v) { return top + plotH - (v / ymax) * plotH; };
    var slot = plotW / bars.length, bw = Math.min(118, slot * 0.72);
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Waterfall from Q1 bookings in the Q1 extract to Q1 bookings in the Q2 extract">';
    for (var t = 0; t <= ymax + 1; t += tickStep) {
      var label = t === 0 ? "$0" : (t >= 1e6 ? "$" + (t / 1e6).toFixed(t % 1e6 ? 1 : 0) + "M" : "$" + (t / 1e3) + "K");
      svg += '<line class="' + (t === 0 ? "base" : "grid") + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
        '<text class="tick" x="' + (padL - 10) + '" y="' + (y(t) + 5) + '">' + label + "</text>";
    }
    bars.forEach(function (b, i) {
      var cx = padL + slot * i + slot / 2, x = cx - bw / 2;
      var hi = Math.max(b.start, b.end), lo = Math.min(b.start, b.end);
      var yTop = y(hi), h = Math.max(2, y(lo) - y(hi));
      var color = b.kind === "total" ? (i === 0 ? "var(--bar-open)" : "var(--bar-close)") : "var(--bar-down)";
      if (i < bars.length - 1) {
        var next = bars[i + 1], level = b.end, nx = padL + slot * (i + 1) + slot / 2 - bw / 2;
        if (next.kind !== "total") svg += '<line class="conn" x1="' + (x + bw) + '" x2="' + nx + '" y1="' + y(level) + '" y2="' + y(level) + '"/>';
      }
      var lines = b.axis.length > 13 ? b.axis.split(" ") : [b.axis];
      var axis = lines.length > 1
        ? '<text class="axis" x="' + cx + '" y="' + (H - bottom + 22) + '">' + esc(lines[0]) + '</text><text class="axis" x="' + cx + '" y="' + (H - bottom + 41) + '">' + esc(lines.slice(1).join(" ")) + "</text>"
        : '<text class="axis" x="' + cx + '" y="' + (H - bottom + 22) + '">' + esc(b.axis) + "</text>";
      svg += '<g class="bar" tabindex="0" role="button" data-line="' + esc(b.line) + '" data-tip="' + esc(b.tooltip) + '">' +
        '<rect class="hit" x="' + (padL + slot * i + 2) + '" y="' + top + '" width="' + (slot - 4) + '" height="' + plotH + '"/>' +
        '<rect class="mark" x="' + x + '" y="' + yTop + '" width="' + bw + '" height="' + h + '" rx="3" fill="' + color + '"/>' +
        '<text class="val" x="' + cx + '" y="' + (yTop - 9) + '">' + esc(b.label) + "</text>" + axis + "</g>";
    });
    return svg + "</svg>";
  }

  function toggleRow(row, open) {
    var body = row.querySelector(".brow-body, .bcard-body");
    var btn = row.querySelector("[aria-expanded]");
    var willOpen = open == null ? body.hidden : open;
    body.hidden = !willOpen;
    btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    var chev = row.querySelector(".chev"); if (chev) chev.textContent = willOpen ? "−" : "+";
    var tg = row.querySelector(".toggle"); if (tg) tg.textContent = (willOpen ? "Hide " : "Show ") + tg.dataset.label;
  }

  // ------------------------------------------------------------------ rep coverage chart
  // Every figure comes formatted from the server for every threshold step; this only
  // chooses which step to show, orders rows, and sizes bars.
  function repChartHTML(c) {
    var i = c.default;
    return '<section class="repchart" id="sec-repchart" aria-label="Rep coverage against a threshold">' +
      '<div class="rc-controls"><div class="rc-slider"><label for="rc-threshold">Coverage threshold: <output id="rc-out">' + esc(c.thresholds[i]) + "</output></label>" +
      '<div class="rc-range"><input type="range" id="rc-threshold" min="0" max="' + (c.thresholds.length - 1) + '" step="1" value="' + i + '" aria-valuetext="' + esc(c.thresholds[i]) + '">' +
      '<div class="ends"><span>' + esc(c.thresholds[0]) + "</span><span>" + esc(c.thresholds[c.thresholds.length - 1]) + "</span></div></div></div>" +
      '<div class="seg" role="group" aria-label="Sort reps">' +
      '<button type="button" data-sort="coverage" aria-pressed="true">Sort by coverage</button>' +
      '<button type="button" data-sort="gap" aria-pressed="false">Sort by dollar gap</button>' +
      '<button type="button" data-sort="reached" aria-pressed="false">Sort by % of quota won</button></div></div>' +
      '<h3 class="rc-head" id="rc-head"></h3>' +
      '<p class="rc-note">At 1.00x this is the answer\u2019s at-risk test. Other thresholds are a what-if: the verdicts above always use 1.00x. Open pipeline counts at full value. A negative gap is a cushion.</p>' +
      '<div class="rc-legend"><span><i style="background:var(--won)"></i>Won</span><span><i style="background:var(--below)"></i>Open, below threshold</span>' +
      '<span><i style="background:var(--meets)"></i>Open, meets threshold</span><span><i class="tick"></i>Threshold \u00d7 quota</span></div>' +
      '<div class="tscroll"><table class="rc"><thead><tr><th>Rep</th><th>Segment</th><th class="n">Won</th><th class="n">Open</th><th class="n">Quota</th>' +
      '<th>Won + open</th><th class="n">Coverage</th><th class="n">% quota won</th><th class="n" id="rc-gap-h">Gap</th></tr></thead><tbody></tbody></table></div>' +
      '<div class="tip" hidden></div></section>';
  }

  function bindRepChart(node, c) {
    var state = {step: c.default, sort: "coverage"};
    var box = node.querySelector(".repchart"), range = box.querySelector("#rc-threshold");
    var tbody = box.querySelector("tbody"), tip = box.querySelector(".tip");
    var last = function (v) { return v == null ? Infinity : v; };
    var orders = {
      coverage: function (a, b) { return last(a.coverage_v) - last(b.coverage_v); },
      gap: function (a, b) {
        var x = a.gap_v[state.step], y = b.gap_v[state.step];
        if (x == null || y == null) return (x == null) - (y == null);
        return y - x;
      },
      reached: function (a, b) { return last(a.reached_v) - last(b.reached_v) || last(a.coverage_v) - last(b.coverage_v); }
    };
    var pctOf = function (v) { return Math.max(0, Math.min(100, 100 * v / c.scale)); };
    function draw() {
      var k = state.step, label = c.thresholds[k];
      box.querySelector("#rc-out").textContent = label;
      range.setAttribute("aria-valuetext", label);
      var h = c.headings[k], n = h.indexOf(" ");
      box.querySelector("#rc-head").innerHTML = "<b>" + esc(h.slice(0, n)) + "</b>" + esc(h.slice(n));
      box.querySelector("#rc-gap-h").textContent = "Gap to " + label;
      tbody.innerHTML = c.reps.slice().sort(orders[state.sort]).map(function (r) {
        var st = r.status[k], tag = st === "below" ? "bad" : st === "meets" ? "good" : "mid";
        var wonW = r.quota_v ? pctOf(r.won_v) : 0, openW = pctOf(r.open_v);
        var gapPx = r.won_v > 0 && r.open_v > 0 ? 2 : 0;
        var marker = r.quota_v ? '<span class="t" style="left:' + pctOf(r.quota_v * c.factors[k]) + '%"></span>' : "";
        var tipText = r.name + ": won " + r.won + " (" + r.won_n + ") + open " + r.open + " (" + r.open_n + ")" + " against " + label + " of a " + r.quota + " quota (" + r.targets[k] + "). Gap: " + r.gaps[k] + ".";
        return "<tr><td class=\"name\">" + esc(r.name) + "</td><td>" + esc(r.segment) + '</td><td class="n">' + esc(r.won) + '<small class="cnt">' + esc(r.won_n) + '</small></td><td class="n">' + esc(r.open) + '<small class="cnt">' + esc(r.open_n) + "</small>" +
          '</td><td class="n">' + esc(r.quota) + '</td><td class="barcell"><div class="rbar" tabindex="0" data-tip="' + esc(tipText) + '" aria-label="' + esc(tipText) + '">' +
          (wonW ? '<span class="w" style="width:' + wonW + '%"></span>' : "") +
          '<span class="o ' + st + '" style="left:calc(' + wonW + "% + " + gapPx + "px); width:" + openW + '%"></span>' + marker + "</div></td>" +
          '<td class="n"><span class="tag ' + tag + '">' + st + "</span>" + esc(r.coverage) + '</td><td class="n">' + esc(r.reached) + '</td><td class="n">' + esc(r.gaps[k]) + "</td></tr>";
      }).join("");
    }
    range.addEventListener("input", function () { state.step = +range.value; draw(); });
    box.querySelectorAll("[data-sort]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.sort = b.dataset.sort;
        box.querySelectorAll("[data-sort]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        draw();
      });
    });
    function show(ev) {
      var bar = ev.target.closest(".rbar"); if (!bar) return;
      var r = box.getBoundingClientRect(), m = bar.getBoundingClientRect();
      tip.textContent = bar.dataset.tip; tip.hidden = false;
      tip.style.left = (m.left - r.left + m.width / 2) + "px";
      tip.style.top = (m.top - r.top - 8) + "px";
    }
    function hide(ev) { if (ev.target.closest(".rbar")) tip.hidden = true; }
    tbody.addEventListener("mouseover", show); tbody.addEventListener("focusin", show);
    tbody.addEventListener("mouseout", hide); tbody.addEventListener("focusout", hide);
    draw();
  }

  function renderAudit(p) {
    if (p.kind !== "audit") return render(p);
    document.getElementById("bridge-title").textContent = p.title;
    var e = p.extracts;
    var rows = p.lines.map(function (l, i) {
      var cls = l.kind === "total" ? (i === 0 ? "total-open" : "total-close") : l.kind;
      var table = l.view === "before" ? compareTable(l.deals.map(function (d) { return {id: d.id, before: d.before, after: null, changed: []}; }))
        : l.view === "after" ? compareTable(l.deals.map(function (d) { return {id: d.id, before: null, after: d.after, changed: []}; }))
        : compareTable(l.deals);
      return '<div class="brow" id="line-' + l.id + '"><button type="button" class="brow-head" aria-expanded="false">' +
        '<span class="chev">+</span><span class="t"><b>' + esc(l.label) + "</b><small>" + esc(l.note) + '</small></span><span class="amt ' + cls + '">' + esc(l.amount) + "</span></button>" +
        '<div class="brow-body" hidden>' + table + "</div></div>";
    }).join("");
    var beyond = p.beyond.map(function (b, i) {
      var n = b.deals ? b.deals.length : b.rows.length;
      var label = n + " affected " + (n === 1 ? "deal" : "deals");
      var table = b.view === "compare" ? compareTable(b.deals, b.compare_fields) : tableHTML({columns: b.columns, rows: b.rows, numeric: []}, b.ids);
      return '<div class="bcard" id="beyond-' + i + '"><div class="bcard-top"><span class="sev ' + b.severity + '">' + esc(b.severity) + "</span><h3>" + esc(b.title) + "</h3></div>" +
        "<p>" + linkify(b.text) + '</p><button type="button" class="toggle" aria-expanded="false" data-label="' + esc(label) + '">Show ' + esc(label) + "</button>" +
        '<div class="bcard-body" hidden>' + table + "</div></div>";
    }).join("");

    var node = el('<div class="card audit">' +
      '<p class="eyebrow">' + esc(p.title) + "</p>" +
      "<h2>" + esc(p.headline) + "</h2>" +
      '<p class="lede">The brief says Q1 is final. Computed from their own files, the two CRM extracts disagree by ' + esc(p.difference) +
      ". Every dollar of that gap traces to a specific deal, below. Every answer in this tool says which extract it used and why.</p>" +
      '<div class="versus">' + e.map(function (x) {
        return '<div><div class="lbl">' + esc(x.label) + '</div><div class="big">' + esc(x.total) + '</div><div class="meta">' + esc(x.file) + " · as of " + esc(x.as_of) + " · " + plural(x.count, "deal") + "</div></div>";
      }).join("") + "</div>" +
      '<div class="chart">' + waterfall(p.chart) + '<div class="tip" hidden></div>' +
      '<p class="chart-note">Each bar is a line of the bridge below. Click a bar to open its deals. ' + (p.balanced ? "The bridge balances to the dollar." : "Unexplained: " + esc(p.unexplained) + ".") + "</p></div>" +
      '<p class="eyebrow plain">The bridge, line by line · click a row to see the deals</p>' +
      '<div class="brows">' + rows + "</div>" +
      '<p class="eyebrow plain">Trust Flags</p>' +
      '<div class="beyond">' + beyond + "</div>" +
      '<p class="next">Ask a question on the left. Each answer shows its source rows, formulas, assumptions and flags.</p></div>');
    main.appendChild(node);

    node.querySelectorAll(".brow-head").forEach(function (h) {
      h.addEventListener("click", function () { toggleRow(h.parentNode); });
    });
    node.querySelectorAll(".toggle").forEach(function (t) {
      t.addEventListener("click", function () { toggleRow(t.parentNode); });
    });
    var tip = node.querySelector(".tip"), chart = node.querySelector(".chart");
    node.querySelectorAll(".bar").forEach(function (g) {
      function go() {
        var row = document.getElementById("line-" + g.dataset.line);
        toggleRow(row, true); flash(row);
      }
      function show(ev) {
        var r = chart.getBoundingClientRect(), m = g.querySelector("rect.mark").getBoundingClientRect();
        tip.textContent = g.dataset.tip; tip.hidden = false;
        tip.style.left = (m.left - r.left + m.width / 2) + "px";
        tip.style.top = (m.top - r.top - 30) + "px";
      }
      g.addEventListener("click", go);
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
      g.addEventListener("mouseenter", show); g.addEventListener("focus", show);
      g.addEventListener("mouseleave", function () { tip.hidden = true; });
      g.addEventListener("blur", function () { tip.hidden = true; });
    });
  }

  // ------------------------------------------------------------------ interactions
  function openSection(id) {
    var d = document.getElementById(id);
    if (d && d.tagName === "DETAILS") d.open = true;
    return d;
  }
  function flash(node) {
    if (!node) return;
    node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
    node.scrollIntoView({behavior: "smooth", block: "start"});
  }
  main.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.jump) { flash(openSection(t.dataset.jump)); return; }
    if (t.dataset.audit) { showAudit(); return; }
    if (t.dataset.naive) {
      var body = t.parentNode.querySelector(".naive-body");
      body.hidden = !body.hidden;
      t.setAttribute("aria-expanded", body.hidden ? "false" : "true");
      t.textContent = body.hidden ? "Show what a naive tool would say" : "Hide what a naive tool would say";
      if (!body.hidden) body.scrollIntoView({behavior: "smooth", block: "nearest"});
      return;
    }
    if (t.dataset.expand) {
      main.querySelectorAll("details.sec").forEach(function (d) { d.open = t.dataset.expand === "1"; });
      return;
    }
    if (t.dataset.ref) {
      openSection("sec-source");
      flash(document.getElementById("ds-" + t.dataset.ref));
      return;
    }
    if (t.dataset.deal) {
      var id = t.dataset.deal;
      main.querySelectorAll("tr.hl").forEach(function (r) { r.classList.remove("hl"); });
      var rows = main.querySelectorAll('tr[data-id="' + id + '"]');
      rows.forEach(function (r) { r.classList.add("hl"); });
      var own = t.closest(".bcard, .brow");
      var local = own ? own.querySelector('tr[data-id="' + id + '"]') : null;
      if (local) {
        var body = local.closest(".brow-body, .bcard-body");
        if (body && body.hidden) toggleRow(body.parentNode, true);
        local.scrollIntoView({behavior: "smooth", block: "center"});
        return;
      }
      var inSource = Array.prototype.filter.call(rows, function (r) { return r.closest("#sec-source"); });
      if (inSource.length) {
        openSection("sec-source");
        inSource[0].scrollIntoView({behavior: "smooth", block: "center"});
      } else if (rows.length) {
        var sec = rows[0].closest("details"); if (sec) sec.open = true;
        rows[0].scrollIntoView({behavior: "smooth", block: "center"});
      }
    }
  });

  document.getElementById("ask-form").addEventListener("submit", function (ev) { ev.preventDefault(); ask(input.value); });
  document.getElementById("audit-link").addEventListener("click", showAudit);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== input) { ev.preventDefault(); input.focus(); }
  });

  api("/api/meta").then(function (meta) {
    renderMeta(meta);
    var deep = new URLSearchParams(window.location.search).get("q");
    if (deep) { input.value = deep; ask(deep); } else { showAudit(); }
  })
    .catch(function () {
      document.getElementById("quarters").innerHTML = "<div><dd>Engine offline</dd></div>";
      main.innerHTML = '<div class="card reject"><h2>Can’t reach the engine</h2><p class="sub">Start it with <span class="mono">python3 app.py</span> from the project folder, then reload this page.</p></div>';
    });
})();
</script>
</body>
</html>
